[package]
name = "taptuna_core"
version = "0.1.0"
edition = "2021"
description = "Native core for taptuna (Protocol Laboratory)"
license = "MIT"
repository = "https://github.com/alex/taptuna"

[lib]
name = "taptuna_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
sha2 = "0.10"
thiserror = "1.0"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[profile.release]
strip = true
lto = true
codegen-units = 1