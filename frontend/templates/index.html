<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Лаборатория протоколов</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header>
  <h1>Лаборатория протоколов</h1>
  <div id="health" class="health">Проверка tshark…</div>
</header>

<main>
  <section class="panel">
    <h2>1. Открыть запись</h2>
    <div class="row">
      <select id="capture-list">
        <option value="">— загрузка… —</option>
      </select>
      <button id="refresh-captures" title="Обновить список">↻</button>
    </div>
    <div class="row">
      <input id="capture-path" type="text"
             placeholder="или введите путь к .pcap/.pcapng">
      <button id="open-capture">Открыть</button>
    </div>
    <div id="open-status" class="status muted">Файл не выбран.</div>
  </section>

  <section class="panel">
    <h2>2. Сессии</h2>
    <div id="sessions-empty" class="muted">Нет открытой записи.</div>
    <table id="sessions-table" hidden>
      <thead>
        <tr>
          <th>#</th>
          <th>Источник</th>
          <th>Назначение</th>
          <th>Пакетов</th>
          <th>Начало</th>
          <th>Длит., с</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/sessions.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
